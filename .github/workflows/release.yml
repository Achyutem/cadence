name: Release

on:
  push:
    tags: ['v*']
  # The Run workflow button in the Actions tab: tags v<versionName> from build.gradle.kts itself.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "::error::$TAG already exists. Bump versionCode and versionName first."
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make sure the SDK pieces are present
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/ks.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "Cadence-${TAG}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs "Cadence-${TAG}.apk"
          shred -u "$RUNNER_TEMP/ks.jks"
          sha256sum "Cadence-${TAG}.apk" > "Cadence-${TAG}.apk.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NOTES="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Cadence $TAG" --notes-file "$NOTES" \
              "Cadence-${TAG}.apk" "Cadence-${TAG}.apk.sha256"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Cadence $TAG" --generate-notes \
              "Cadence-${TAG}.apk" "Cadence-${TAG}.apk.sha256"
          fi
