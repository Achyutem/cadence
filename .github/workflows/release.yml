name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make sure the SDK pieces are present
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/ks.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "Cadence-${GITHUB_REF_NAME}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs "Cadence-${GITHUB_REF_NAME}.apk"
          shred -u "$RUNNER_TEMP/ks.jks"
          sha256sum "Cadence-${GITHUB_REF_NAME}.apk" > "Cadence-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NOTES="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "Cadence $GITHUB_REF_NAME" --notes-file "$NOTES" \
              "Cadence-${GITHUB_REF_NAME}.apk" "Cadence-${GITHUB_REF_NAME}.apk.sha256"
          else
            gh release create "$GITHUB_REF_NAME" --title "Cadence $GITHUB_REF_NAME" --generate-notes \
              "Cadence-${GITHUB_REF_NAME}.apk" "Cadence-${GITHUB_REF_NAME}.apk.sha256"
          fi
